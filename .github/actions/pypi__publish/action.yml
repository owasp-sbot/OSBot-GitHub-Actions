name: Publish to PyPI
description: 'Publish to PyPI with Trusted Publishing (OIDC)'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install Poetry
      shell: bash
      run: |
        curl -sSL https://install.python-poetry.org | python3 - --version 1.8.3
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Build package
      shell: bash
      run: |
        rm -rf dist/
        poetry build
    
    - name: Install publishing tools
      shell: bash
      run: |
        pip install --upgrade twine pypi-publish
    
    - name: Check package
      shell: bash
      run: |
        twine check dist/*
    
    - name: Mint OIDC token and publish
      shell: bash
      run: |
        # pypi-publish handles the OIDC token exchange automatically
        pypi-publish --verbose

