name: Publish to PyPI
description: 'Publish to PyPI with Trusted Publishing (OIDC)'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install Poetry
      shell: bash
      run: |
        curl -sSL https://install.python-poetry.org | python3 - --version 1.8.3
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Build package
      shell: bash
      run: |
        rm -rf dist/
        poetry build
    
    - name: Install twine with OIDC support
      shell: bash
      run: |
        pip install --upgrade "twine>=5.0.0" id
    
    - name: Check package
      shell: bash
      run: |
        twine check dist/*
        echo "Files to publish:"
        ls -la dist/
    
    - name: Publish to PyPI using OIDC
      shell: bash
      run: |
        # The 'id' package provides OIDC token minting for PyPI
        python -m twine upload dist/* --verbose

